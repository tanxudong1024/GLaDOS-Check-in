name: GLaDOS 签到

on:
  schedule:
    # 每日 00:05（UTC+8）；GitHub cron 为 UTC → 前一日 16:05 UTC
    - cron: "5 16 * * *"
  workflow_dispatch:

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 需要在 Settings → Secrets and variables → Actions 配置：
      #   Secret  GLADOS_COOKIE：浏览器完整 Cookie（含 gld:sess / gld:sess.sig）
      #   Secret  GLADOS_UA：取 Cookie 浏览器的 navigator.userAgent（必须与 Cookie 同一浏览器）
      #   Variable GLADOS_ORIGIN（可选）：站点根地址，如 https://glados.space
      - name: 签到
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_UA: ${{ vars.GLADOS_UA || secrets.GLADOS_UA || vars.GLADOS_USER_AGENT || secrets.GLADOS_USER_AGENT }}
          GLADOS_ORIGIN: ${{ vars.GLADOS_ORIGIN }}
        run: python check_in.py
